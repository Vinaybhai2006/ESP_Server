<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP8266 LED Control</title>
<style>
  body {
    font-family: -apple-system, Arial, sans-serif;
    background: #111;
    color: #eee;
    text-align: center;
    padding: 40px 20px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  #status { margin: 10px 0 30px; font-size: 15px; color: #aaa; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  .on { background:#4caf50; }
  .off { background:#e53935; }
  button {
    width: 80%;
    max-width: 300px;
    padding: 20px;
    margin: 10px auto;
    display: block;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  #btnOn  { background: #2e7d32; color: white; }
  #btnOff { background: #c62828; color: white; }
  #log { margin-top: 30px; font-size: 12px; color: #666; white-space: pre-wrap; }
</style>
</head>
<body>

<h1>ESP8266 LED Control</h1>
<div id="status"><span class="dot off" id="dot"></span><span id="statusText">Unknown</span></div>

<button id="btnOn">LED ON</button>
<button id="btnOff">LED OFF</button>

<div id="log"></div>

<script>
  // ---- Fill in your own Adafruit IO details here ----
  const AIO_USERNAME = "Jadav_2006";
  const AIO_KEY      = "aio_hZKI52TUxS9IdENDHQ9YMvltV11j";
  const FEED_NAME    = "led";          // command feed the ESP8266 subscribes to
  const STATUS_FEED  = "led-status";   // status feed the ESP8266 publishes to
  // -----------------------------------------------------

  const API_BASE = `https://io.adafruit.com/api/v2/${AIO_USERNAME}/feeds`;

  function log(msg) {
    document.getElementById("log").textContent += msg + "\n";
  }

  function setStatusDisplay(state) {
    const dot = document.getElementById("dot");
    const text = document.getElementById("statusText");
    if (state === "ON") {
      dot.className = "dot on";
      text.textContent = "LED is ON";
    } else if (state === "OFF") {
      dot.className = "dot off";
      text.textContent = "LED is OFF";
    } else {
      text.textContent = "Unknown";
    }
  }

  async function sendCommand(value) {
    try {
      const res = await fetch(`${API_BASE}/${FEED_NAME}/data`, {
        method: "POST",
        headers: {
          "X-AIO-Key": AIO_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ value: value })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      log(`Sent: ${value}`);
      // optimistic UI update; real confirmation comes from polling below
      setStatusDisplay(value);
    } catch (err) {
      log(`Error sending command: ${err.message}`);
    }
  }

  async function pollStatus() {
    try {
      const res = await fetch(`${API_BASE}/${STATUS_FEED}/data/last`, {
        headers: { "X-AIO-Key": AIO_KEY }
      });
      if (!res.ok) return;
      const data = await res.json();
      if (data && data.value) {
        setStatusDisplay(data.value);
      }
    } catch (err) {
      // silent fail on poll; not critical
    }
  }

  document.getElementById("btnOn").addEventListener("click", () => sendCommand("ON"));
  document.getElementById("btnOff").addEventListener("click", () => sendCommand("OFF"));

  // check actual device status every 4 seconds
  pollStatus();
  setInterval(pollStatus, 4000);
</script>

</body>
</html>
